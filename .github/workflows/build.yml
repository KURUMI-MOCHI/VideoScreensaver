name: Build VideoScreensaver

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build solution
      run: msbuild VideoScreensaver.sln /p:Configuration=Release /p:Platform=x86

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoScreensaver-Binary
        # パスを「**/」にすることで、サブフォルダの中まで探しに行かせます
        path: "**/VideoScreensaver.exe"
        # もし見つからなかったらエラーとして報告させる（デバッグ用）
        if-no-files-found: error
